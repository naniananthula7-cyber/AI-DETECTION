<!DOCTYPE html>
<html>
<head>
    <title>AI Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-top: 30px;
            font-size: 2.5em;
            color: #333;
        }
        h3 {
            margin-bottom: 40px;
            color: #666;
        }
        button {
            font-size: 1.2em;
            padding: 15px 30px;
            margin: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .start {
            background: #4CAF50;
            color: white;
        }
        .start:hover {
            background: #45a049;
        }
        .stop {
            background: #f44336;
            color: white;
        }
        .stop:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <h1>AI DETECTION</h1>
    <h3>Click the start button and start your detection</h3>

    {% if show_stop %}
        <a href="{{ url_for('stop') }}"><button class="stop">🛑 Stop & Upload</button></a>
    {% else %}
        <a href="{{ url_for('start') }}"><button class="start">▶️ Start Detection</button></a>
    {% endif %}
</body>
</html>
